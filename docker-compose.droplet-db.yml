# Postgres on the same DigitalOcean Droplet as billgenie-api.
# Fresh empty DB — GORM AutoMigrate creates schema on API start.
#
# One-time (on droplet):
#   1. Copy scripts/db.env.example → /opt/billgenie/db.env and set a strong password
#   2. docker network create billgenie_net   # if missing
#   3. docker compose -f docker-compose.droplet-db.yml --env-file /opt/billgenie/db.env up -d
#   4. Set DATABASE_URL in /opt/billgenie/.env (see DEPLOY_DROPLET.md)
#   5. ./scripts/deploy-droplet.sh
#
# Requires Docker Compose v2.

name: billgenie-db

services:
  postgres:
    image: postgres:15-alpine
    container_name: billgenie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-billgenie}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/billgenie/db.env}
      POSTGRES_DB: ${POSTGRES_DB:-billgenie}
    # Host access for backups / psql only — never expose publicly.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - billgenie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-billgenie} -d ${POSTGRES_DB:-billgenie}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billgenie_net

volumes:
  billgenie_pgdata:

networks:
  billgenie_net:
    name: billgenie_net
    external: true
