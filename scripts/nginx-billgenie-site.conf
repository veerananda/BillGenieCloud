# Managed example — copy to /etc/nginx/sites-available/billgenie
# Requires /etc/nginx/conf.d/billgenie-upstream.conf (written by deploy-droplet.sh)
#
# One-time on droplet:
#   cp scripts/nginx-billgenie-site.conf /etc/nginx/sites-available/billgenie
#   # or merge proxy_pass lines to use http://billgenie_backend
#   nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 168.144.217.143 api.thebillgenie.com;

    # Certbot will add ssl listen + certificates when you run:
    #   certbot --nginx -d api.thebillgenie.com

    access_log /var/log/nginx/billgenie-access.log;
    error_log  /var/log/nginx/billgenie-error.log;

    client_max_body_size 20m;

    location /ws {
        proxy_pass http://billgenie_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location ~ ^/(a|t)/[^/]+/events$ {
        proxy_pass http://billgenie_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /health {
        proxy_pass http://billgenie_backend/health;
        access_log off;
    }

    location / {
        proxy_pass http://billgenie_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
